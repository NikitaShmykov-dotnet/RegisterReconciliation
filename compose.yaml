services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: reconcile
      POSTGRES_USER: reconcile
      POSTGRES_PASSWORD: ${RECONCILE_DB_PASSWORD:?Set RECONCILE_DB_PASSWORD}
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U reconcile -d reconcile"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - reconcile-data:/var/lib/postgresql
volumes:
  reconcile-data:
